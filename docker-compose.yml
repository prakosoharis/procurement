services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Docker harus memakai Postgres container lokal. Isi DOCKER_DATABASE_URL
      # hanya bila memang sengaja ingin mengarahkan container ke database lain.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://procurement:procurement@postgres:5432/procurement?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-staging}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-google-drive}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-}
      GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      TRIGGER_PROJECT_ID: ${TRIGGER_PROJECT_ID:-}
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY:-}
    volumes:
      - .:/app
      # Menimpa .env host yang ikut terbawa bind mount agar Prisma tidak
      # menjalankan db push terhadap Neon ketika Docker dipakai secara lokal.
      - ./.env.docker:/app/.env:ro
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    command: >-
      sh -c "find .next -mindepth 1 -maxdepth 1 -exec rm -rf {} + && node scripts/ensure-pgvector.js && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
      POSTGRES_DB: procurement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  node_modules:
  next_cache:
